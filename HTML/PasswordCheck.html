<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <link rel="shortcut icon" sizes="114x114" href="/Photo/icon/Logo-DeleteBackGround.png"type="image/x-icon">
    <link rel="stylesheet" href="/CSS/Navbar.css">
    <link rel="stylesheet" href="/CSS/ContractZone.css">
    <link rel="stylesheet" href="/CSS/Function.css">

    
</head>
<body>

    <script src="/Json/Blockrightclick.js"></script>
    <script src="/Json/Password.js"></script>

         <!--Navbar-->
    <div class="Navbar" data-testid="login-navbar">
        <div class="Name" data-testid="login-navbar-name">
            <a style="text-decoration: none; color: aliceblue; cursor:text;" href="/HTML/PasswordCheck.html" data-testid="login-brand-link">Chonlatree Ketkorwoing</a>
        </div>

        <select class="selector" data-testid="login-navigation-select" onchange="window.location.href=this.value;">
            <option value="/index.html">Home</option>
            <option value="/HTML/Profile.html">Profile</option>
            <option value="/HTML/Portfilo.html">Portfolio</option>
            <option value="/HTML/EducationalRecord.html">Educational Record</option>
        </select>

        <ul data-testid="login-navigation-list">
                <li class="link"> <a href="/index.html" data-testid="login-nav-home-link">Home</a> </li>
                <li class="link"> <a href="/HTML/Profile.html" data-testid="login-nav-profile-link">Profile</a> </li>
                <li class="link"> <a href="/HTML/Portfilo.html" data-testid="login-nav-portfolio-link">Portfolio</a> </li>
                <li class="link"> <a href="/HTML/EducationalRecord.html" data-testid="login-nav-education-link">Educational Record</a> </li>
        </ul>
    </div>

    
    <!--Content Zone-->
    <div class="contentZone" data-testid="login-form">
        <a>User Name :</a>
        <input class="text-field" id="username-field" data-testid="login-username-input" type="text" placeholder="User Name" required><br>
        <a>Password :</a>
        <input class="text-field" id="password-field" data-testid="login-password-input" type="password" placeholder="Password" required>
        <button class="button-seethrough" id="button-seethrough" data-testid="login-password-toggle" onclick="seethrough()">👁️</button><br>
        <button class="button" id="password-button" data-testid="login-submit-button" onclick="passwordCheck()"><a style="font-size: 15px;" data-testid="login-submit-label">Login</a></button><br>
        <a style="text-align: center; font-size: 20px;" id="alartMessage" data-testid="login-alert"></a>
    </div>

    <!--Contract Zone-->
    <div class="profile_link" data-testid="login-contact">
        <br>
        <hr id="The_Line">
        <br>
        <div class="Logo" data-testid="login-contact-links">
            <ul data-testid="login-contact-list">
                <li>
                    <a id="Text-contract" data-testid="login-contact-heading">--Contract Me--</a>
                </li>
                <a href="https://github.com/HajimaruRay" target="_blank" data-testid="login-github-link">
                    <img class="photo" src="/Photo/icon/Github.png" width="40px" alt="github">
                </a>
                <a href="https://www.facebook.com/hajimaruuu" target="_blank" data-testid="login-facebook-link">
                    <img class="photo" src="/Photo/icon/facebook.png" width="40px" alt="facebook">
                </a>
            </ul>
        </div>
    </div>

</body>
</html>

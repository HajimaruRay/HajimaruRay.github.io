<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Calculater</title>

    <link rel="shortcut icon" sizes="114x114" href="/Photo/icon/Logo-DeleteBackGround.png" type="image/x-icon">
    <link rel="stylesheet" href="/CSS/Navbar.css">
    <link rel="stylesheet" href="/CSS/ContractZone.css">
    <link rel="stylesheet" href="/CSS/FuelCalculater.css">


</head>

<body>

    <script src="/Json/FuelCalculater.js" async></script>
    <script src="/Json/Password.js" async></script>
    <script src="/Json/DropDown.js" async></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>

         <!--Navbar-->
    <div class="Navbar" data-testid="fuel-navbar">
        <div class="Name" data-testid="fuel-navbar-name">
            <a style="text-decoration: none; color: aliceblue; cursor:text;" href="/HTML/PasswordCheck.html" data-testid="fuel-login-link">Chonlatree Ketkorwoing</a>
        </div>

        <select class="selector" data-testid="fuel-navigation-select" onchange="window.location.href=this.value;">
            <option value="/index.html">Home</option>
            <option value="/HTML/Profile.html">Profile</option>
            <option value="/HTML/Portfilo.html">Portfolio</option>
            <option value="/HTML/EducationalRecord.html">Educational Record</option>
        </select>

        <ul data-testid="fuel-navigation-list">
                <li class="link"> <a href="/index.html" data-testid="fuel-nav-home-link">Home</a> </li>
                <li class="link"> <a href="/HTML/Profile.html" data-testid="fuel-nav-profile-link">Profile</a> </li>
                <li class="link"> <a href="/HTML/Portfilo.html" data-testid="fuel-nav-portfolio-link">Portfolio</a> </li>
                <li class="link"> <a href="/HTML/EducationalRecord.html" data-testid="fuel-nav-education-link">Educational Record</a> </li>
        </ul>
    </div>


    <!--Content Zone-->
    <div class="contentZone" data-testid="fuel-calculator">
        <a id="fuelPriceText">ราคาน้ำมัน :</a>
        <input class="text-field" id="fuelPrice" data-testid="fuel-price-input" type="text" placeholder="ราคาน้ำมันปัจจุบัน" required><br>

        <a id="priceAmountText">ราคาที่ต้องการเติม :</a>
        <input class="text-field" id="priceAmount" data-testid="fuel-price-amount-input" type="text" placeholder="ราคาที่ต้องการเติม">
        <a id="literAmountText">จำนวนลิตรที่ต้องการเติม :</a>
        <input class="text-field" id="literAmount" data-testid="fuel-liter-amount-input" type="text" placeholder="จำนวนลิตรที่ต้องการเติม">
        <select class="amountSelector" data-testid="fuel-amount-selector" onclick="selectAmount()">
            <option value="priceAmount">ราคาที่ต้องการเติม</option>
            <option value="literAmount">จำนวนลิตรที่ต้องการเติม</option>
        </select> <br>
        <a id="kmPerliterText">อัตราสิ้นเปลืองน้ำมัน :</a>
        <input class="text-field" id="kmPerliter" data-testid="fuel-efficiency-input" type="text" placeholder="อัตราสิ้นเปลืองน้ำมัน">
        <select id="selector" data-testid="fuel-efficiency-selector" onclick="selectAmount()">
            <option value="Km/L">Km/L</option>
            <option value="L/100Km">L/100Km</option>
        </select><br>

        <button class="botton" id="button" data-testid="fuel-calculate-button" onclick="fuelcal()">Calculate</button>
        <button class="botton" id="button" data-testid="fuel-clear-button" onclick="clearInputs()">Clear</button>
        <button class="botton" id="button" data-testid="fuel-download-button" onclick="downloadExcel()">Download</button>
        <p id="result" data-testid="fuel-result"></p>
    </div>

    <!--Contract Zone-->
    <div class="profile_link" data-testid="fuel-contact">
        <br>
        <hr id="The_Line">
        <br>
        <div class="Logo" data-testid="fuel-contact-links">
            <ul data-testid="fuel-contact-list">
                <li>
                    <a id="Text-contract" data-testid="fuel-contact-heading">--Contract Me--</a>
                </li>
                <a href="https://github.com/HajimaruRay" target="_blank" data-testid="fuel-github-link">
                    <img class="photo" src="/Photo/icon/Github.png" width="40px" alt="github">
                </a>
                <a href="https://www.facebook.com/hajimaruuu" target="_blank" data-testid="fuel-facebook-link">
                    <img class="photo" src="/Photo/icon/facebook.png" width="40px" alt="facebook">
                </a>
            </ul>
        </div>
    </div>

</body>

</html>
